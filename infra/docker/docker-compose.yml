services:
  postgres:
    image: postgres:16-alpine
    container_name: ba33-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ba33
      POSTGRES_PASSWORD: ba33_dev_password
      POSTGRES_DB: ba33_platform
    ports:
      - "5450:5432"
    volumes:
      - ba33-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ba33 -d ba33_platform"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ba33-redis
    restart: unless-stopped
    ports:
      - "6390:6379"
    volumes:
      - ba33-redis-data:/data

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dev
    container_name: ba33-api
    restart: unless-stopped
    working_dir: /app
    environment:
      DATABASE_URL: postgres://ba33:ba33_dev_password@postgres:5432/ba33_platform
      REDIS_URL: redis://redis:6379
      PORT: 3001
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "pnpm install --frozen-lockfile && pnpm --filter @ba33/api dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "3001:3001"
    volumes:
      - ../..:/app
      - ba33-api-node-modules:/app/node_modules
      - ba33-api-workspace-node-modules:/app/apps/api/node_modules

  web-operations:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dev
    container_name: ba33-web-operations
    restart: unless-stopped
    working_dir: /app
    environment:
      BA33_API_URL: http://api:3001
      NEXT_PUBLIC_BA33_API_URL: /_ba33_api
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "pnpm install --frozen-lockfile && pnpm --filter @ba33/web-operations dev"
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:3000"
    volumes:
      - ../..:/app
      - ba33-web-operations-node-modules:/app/node_modules
      - ba33-web-operations-workspace-node-modules:/app/apps/web-operations/node_modules
      - ba33-web-operations-next:/app/apps/web-operations/.next

volumes:
  ba33-postgres-data:
  ba33-redis-data:
  ba33-api-node-modules:
  ba33-api-workspace-node-modules:
  ba33-web-operations-node-modules:
  ba33-web-operations-workspace-node-modules:
  ba33-web-operations-next:
