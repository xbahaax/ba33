name: mobile_transporter
description: "ba33 Transporter App — scan, deliver, and track transport"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.1.2
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  mobile_scanner: ^5.2.3
  pdf: ^3.11.1
  printing: ^5.13.1
  connectivity_plus: ^6.0.3
  geolocator: ^13.0.2
  drift: ^2.21.0
  drift_flutter: ^0.2.3
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.0
  ba33_ui:
    path: ../../packages/ba33_ui
  ba33_domain:
    path: ../../packages/ba33_domain
  ba33_api_client:
    path: ../../packages/ba33_api_client

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  drift_dev: ^2.21.0
  build_runner: ^2.4.14
  custom_lint:
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
