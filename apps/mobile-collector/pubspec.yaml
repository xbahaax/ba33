name: mobile_collector
description: "ba33 Field Collector App — offline-first wool collection"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  ba33_ui:
    path: ../../packages/ba33_ui
  ba33_domain:
    path: ../../packages/ba33_domain
  ba33_api_client:
    path: ../../packages/ba33_api_client
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  custom_lint:
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
