name: mobile_shepherd
description: "ba33 Shepherd Lite App — announce wool availability"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.0
  ba33_ui:
    path: ../../packages/ba33_ui
  ba33_api_client:
    path: ../../packages/ba33_api_client
  ba33_domain:
    path: ../../packages/ba33_domain

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  custom_lint:
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
